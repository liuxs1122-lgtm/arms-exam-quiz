<div class="shell">
  <header class="top"><div class="brand"><div class="mark">AR</div><div>ARMS 知识测验<small>OPERATIONS · PRACTICE</small></div></div><div class="topnote">50 道单选 · 即时判题</div></header>
  <main class="home" id="home">
    <div class="mainhead"><div><div class="eyebrow">ARMS SYSTEM</div><h1>运行知识测验</h1></div><div class="tag">50 题</div></div>
    <section class="card"><h2>选择答题模式</h2>
      <div class="mode-options" role="radiogroup" aria-label="答题模式">
        <label class="mode-choice selected" id="orderedChoice"><input type="radio" name="mode" value="ordered" checked><span>顺序答题</span></label>
        <label class="mode-choice" id="shuffledChoice"><input type="radio" name="mode" value="shuffled"><span>乱序答题</span></label>
      </div>
      <div class="home-actions"><button class="btn primary" id="startFull">开始50题 →</button><button class="btn" id="startFavorites">收藏题目练习（0）</button></div>
      <div class="empty" id="favoriteEmpty">还没有收藏题目。答题时点击右上角书签即可收藏。</div>
      <p class="privacy-note">收藏内容只保存在当前设备的浏览器中；答题分数不会上传或汇总。</p>
    </section>
  </main>
  <div class="layout quiz hide" id="quiz">
    <aside class="side"><section class="sidecard"><div class="eyebrow" id="runLabel">本轮进度</div><div class="count"><span id="progressText">01</span><span id="progressTotal"> / 50</span></div><div class="progress"><i id="progressBar"></i></div><div class="statline"><span>已完成 <b id="answered">0</b></span><span>答对 <b id="correctCount">0</b></span></div><div class="dots" id="dots"></div></section></aside>

        <h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="nav"><button class="btn" id="prev">← 上一题</button><span class="hint" id="navhint">选择答案后可继续</span><button class="btn primary" id="next">下一题 →</button></div>
      </section>
    </main>
  </div>
  <section class="result" id="result"></section>
  <div class="foot">答案依据所提供的 ARMS 考试题库 · 收藏保存在本机浏览器</div>
</div>

const letters=['A','B','C','D'];
const $=id=>document.getElementById(id);
const clean=s=>String(s??'').replace(/\s+/g,' ').trim();
const storageKey='arms-quiz-favorites-v1';
const starSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 14.6 9l6 .8-4.3 4.2 1 6-5.3-2.8-5.3 2.8 1-6-4.3-4.2 6-.8L12 3.5Z"/></svg>';
let mode='ordered',runType='full',runQuestions=[],answers=[],current=0,done=false,nudge=false,favorites=readFavorites();
function readFavorites(){try{const x=JSON.parse(localStorage.getItem(storageKey)||'[]');return Array.isArray(x)?x.filter(v=>questions.some(q=>q.id===String(v))).map(String):[]}catch{return[]}}
function saveFavorites(next){favorites=next;try{localStorage.setItem(storageKey,JSON.stringify(next))}catch{};renderFavoriteCount();if($('favoriteToggle')&&runQuestions[current])renderFavoriteButton()}
function renderFavoriteCount(){$('startFavorites').textContent=`收藏题目练习（${favorites.length}）`;$('startFavorites').disabled=favorites.length===0;$('favoriteEmpty').style.display=favorites.length?'none':'block'}
function renderFavoriteButton(){const q=runQuestions[current];if(!q)return;const yes=favorites.includes(q.id),b=$('favoriteToggle');b.classList.toggle('active',yes);b.setAttribute('aria-pressed',String(yes));b.setAttribute('aria-label',yes?'取消收藏':'收藏题目');b.title=yes?'取消收藏':'收藏题目';b.innerHTML=starSvg}
function toggleFavorite(id){const key=String(id);const has=favorites.includes(key);saveFavorites(has?favorites.filter(x=>x!==key):[...favorites,key]);render()}
function getSelectedMode(){mode=document.querySelector('input[name="mode"]:checked')?.value||'ordered';$('orderedChoice').classList.toggle('selected',mode==='ordered');$('shuffledChoice').classList.toggle('selected',mode==='shuffled')}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startRun(type,items){if(!items?.length)return;getSelectedMode();runType=type;runQuestions=mode==='shuffled'?shuffle(items):[...items];answers=Array(runQuestions.length).fill(null);current=0;done=false;nudge=false;$('home').classList.add('hide');$('result').classList.remove('show');$('quiz').classList.remove('hide');render();window.scrollTo({top:0,behavior:'smooth'})}
function returnHome(){done=false;$('quiz').classList.add('hide');$('result').classList.remove('show');$('home').classList.remove('hide');renderFavoriteCount();window.scrollTo({top:0,behavior:'smooth'})}
function render(){if(!$('quiz')||$('quiz').classList.contains('hide')||!runQuestions.length||done)return;const q=runQuestions[current],chosen=answers[current];$('progressText').textContent=String(current+1).padStart(2,'0');$('progressTotal').textContent=` / ${runQuestions.length}`;$('progressBar').style.width=`${(current+1)/runQuestions.length*100}%`;$('answered').textContent=answers.filter(x=>x!==null).length;$('correctCount').textContent=answers.filter((x,i)=>x===runQuestions[i].answer).length;$('qnum').textContent=`QUESTION ${String(current+1).padStart(2,'0')}`;$('runLabel').textContent=runType==='favorites'?'收藏题进度':runType==='wrong'?'错题再答进度':'本轮进度';$('modeTag').textContent=runType==='favorites'?'收藏题练习':runType==='wrong'?'错题再答':mode==='ordered'?'顺序答题':'乱序答题';$('question').textContent=q.question;renderFavoriteButton();$('options').innerHTML=q.options.map((o,i)=>`<button class="option ${chosen!==null&&i===q.answer?'correct':''} ${chosen===i&&chosen!==q.answer?'incorrect':''}" data-i="${i}" ${chosen!==null?'disabled':''}><span class="letter">${letters[i]}</span><span>${clean(o)}</span></button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>select(+b.dataset.i));const f=$('feedback');f.className='feedback';if(chosen!==null){const ok=chosen===q.answer;f.classList.add(ok?'good':'bad');f.innerHTML=ok?'<strong>回答正确 ✓</strong>答得很好，继续下一题。':`<strong>回答错误</strong><span class="answerline">正确答案：${letters[q.answer]}. ${clean(q.options[q.answer])}</span>`}if(nudge){f.className='feedback bad';f.classList.add('show');f.innerHTML='<strong>请先选择一个答案</strong>'}f.classList.toggle('show',chosen!==null||nudge);$('prev').disabled=current===0;$('next').textContent=current===runQuestions.length-1?'查看成绩 →':'下一题 →';$('navhint').textContent=chosen===null?'选择答案后可继续':'已记录本题答案';$('dots').innerHTML=runQuestions.map((x,i)=>`<button class="dot ${i===current?'current':''} ${answers[i]!==null?(answers[i]===x.answer?'done':'wrong'):''}" data-i="${i}" aria-label="第${i+1}题">${i+1}</button>`).join('');document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{current=+b.dataset.i;nudge=false;render()})}
function select(i){if(answers[current]!==null)return;answers[current]=i;nudge=false;render()}
function advance(){if(answers[current]===null){nudge=true;render();return}if(current===runQuestions.length-1){finish();return}current++;nudge=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function modeLabel(){return runType==='wrong'?'错题再答':runType==='favorites'?`收藏题练习 · ${mode==='ordered'?'顺序':'乱序'}`:`${mode==='ordered'?'顺序答题':'乱序答题'}`}
function favoriteButton(q){const yes=favorites.includes(q.id);return `<button class="icon-btn ${yes?'active':''}" type="button" data-fav="${q.id}" aria-label="${yes?'取消收藏':'收藏题目'}" aria-pressed="${yes}" title="${yes?'取消收藏':'收藏题目'}">${starSvg}</button>`}
function bindFavoriteButtons(){document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{toggleFavorite(b.dataset.fav);document.querySelectorAll('[data-fav]').forEach(btn=>{const yes=favorites.includes(String(btn.dataset.fav));btn.classList.toggle('active',yes);btn.setAttribute('aria-pressed',String(yes));btn.setAttribute('aria-label',yes?'取消收藏':'收藏题目');btn.title=yes?'取消收藏':'收藏题目'});const c=$('favoriteCountPill');if(c)c.innerHTML=`收藏<b>${favorites.length}</b>`})}
function finish(){done=true;const good=answers.filter((a,i)=>a===runQuestions[i].answer).length,score=Math.round(good/runQuestions.length*100),missed=runQuestions.map((q,i)=>({q,i})).filter(x=>answers[x.i]!==x.q.answer);const canRetry=missed.length>0;$('quiz').classList.add('hide');$('result').className='result show';$('result').innerHTML=`<section class="card resultcard"><div class="scorelabel">${runType==='wrong'?'错题再答完成':'本轮测验完成'}</div><div class="resultmode">答题模式：${modeLabel()}</div><div class="score">${score}<small> / 100</small></div><div class="resulttitle">${score>=90?'表现出色':score>=70?'继续巩固':'复习后再挑战'}</div><div class="resultdesc">答对 ${good} 题，答错 ${missed.length} 题</div><div class="resultstats"><span class="pill">正确率<b>${score}%</b></span><span class="pill">本轮题数<b>${runQuestions.length}</b></span><span class="pill">错题<b>${missed.length}</b></span><span class="pill" id="favoriteCountPill">收藏<b>${favorites.length}</b></span></div><div class="result-actions">${canRetry?`<button class="btn primary" id="retryWrong">错题再答（${missed.length}题）</button>`:''}<button class="btn" id="backHome">返回首页</button><button class="btn" id="restart">重新开始</button></div></section><section class="mistakes"><h2>错题回顾 <span class="tag">${missed.length} 题</span></h2>${missed.length?missed.map(({q,i})=>`<article class="mistake"><div class="mistake-head"><div><h3>原题 ${q.originalNumber}. ${q.question}</h3><p>你的答案：${answers[i]!==null?`${letters[answers[i]]}. ${clean(q.options[answers[i]])}`:'未作答'}</p><p class="answer">正确答案：${letters[q.answer]}. ${clean(q.options[q.answer])}</p></div>${favoriteButton(q)}</div></article>`).join(''):'<div class="empty">本轮全对，错题本空空如也！</div>'}</section>`;$('backHome').onclick=returnHome;$('restart').onclick=()=>{if(runType==='wrong'){startRun('wrong',runQuestions.filter((q,i)=>answers[i]!==q.answer))}else if(runType==='favorites'){startRun('favorites',runQuestions)}else returnHome()};if(canRetry)$('retryWrong').onclick=()=>startRun('wrong',missed.map(x=>x.q));bindFavoriteButtons();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('input[name="mode"]').forEach(x=>x.addEventListener('change',getSelectedMode));$('startFull').onclick=()=>startRun('full',questions);$('startFavorites').onclick=()=>{const items=questions.filter(q=>favorites.includes(q.id));if(items.length)startRun('favorites',items)};$('favoriteToggle').onclick=()=>toggleFavorite(runQuestions[current].id);$('prev').onclick=()=>{if(current>0){current--;nudge=false;render()}};$('next').onclick=advance;renderFavoriteCount();getSelectedMode();
</script>
</body>
